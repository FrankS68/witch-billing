# Prod-Deployment auf IONOS (claudine). nginx (billing.segieth.cologne, Wildcard-Zertifikat
# *.segieth.cologne) leitet per HTTPS auf 127.0.0.1:8085 weiter, siehe deploy/nginx-billing.segieth.cologne.conf.
#
# .env (nicht eingecheckt):
#   COMPOSE_PROJECT_NAME=witch-billing
#   COMPOSE_FILE=compose.prod.yml
#   HEALTH_URL=http://localhost:8085
# config/application-prod.properties (chmod 600, nicht eingecheckt):
#   OAuth-Zugangsdaten, witch-auth.first-admin-email, witch-billing.app-keys.<app>=<SHA-256-Hash>
# .github_token (chmod 600, nicht eingecheckt): GitHub-Token mit read:packages. Muss im
#   Projektordner liegen - Docker Buildx verweigert Secrets ausserhalb des Build-Kontexts.
# Ausrollen: ./deploy.sh main
services:
  billing:
    image: witch-billing:latest
    build:
      context: .
      secrets:
        - github_token
    container_name: billing-app
    ports:
      # nur lokal: von aussen ausschliesslich ueber nginx/HTTPS erreichbar
      - "127.0.0.1:8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # hinter nginx: X-Forwarded-Proto auswerten, damit OAuth-Redirects https://billing.segieth.cologne nutzen
      - SERVER_FORWARD_HEADERS_STRATEGY=native
    volumes:
      - ./config:/app/config      # application-prod.properties
      - billing-data:/app/data    # H2-Datenbank (Konten, Buchungen, Preisliste, Benutzer)
    restart: unless-stopped

volumes:
  billing-data:

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-./.github_token}
