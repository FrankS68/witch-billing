# nginx auf IONOS fuer https://billing.segieth.cologne (wie quiz.segieth.cologne).
# Einrichten (als fse, mit sudo):
#   sudo cp deploy/nginx-billing.segieth.cologne.conf /etc/nginx/sites-available/billing.segieth.cologne
#   sudo ln -s /etc/nginx/sites-available/billing.segieth.cologne /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
upstream billing {
    server 127.0.0.1:8085;
    keepalive 32;
}

server {
    listen 80;
    server_name billing.segieth.cologne;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name billing.segieth.cologne;
    # Wildcard-Zertifikat *.segieth.cologne (gemeinsam mit knownet, games, quiz)
    ssl_certificate     /etc/nginx/ssl/segieth.cologne/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/segieth.cologne/privkey.pem;

    location / {
        proxy_pass http://billing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
