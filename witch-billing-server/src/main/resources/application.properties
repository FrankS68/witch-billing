# Lokale, nicht eingecheckte Einstellungen (OAuth-Secrets usw.), siehe application-local.properties.example.
# Alternativ ueber Umgebungsvariablen, z.B. SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
spring.config.import=optional:file:./application-local.properties

# Erster Login mit dieser Email wird automatisch Admin (witch-auth Modul)
witch-auth.first-admin-email=${FIRST_ADMIN_EMAIL:}

# Beschriftung der witch-auth Login-Seite
witch-auth.app-name=Witch Billing

# 8080 DerGarten, 8081 games, 8082 knownet, 8084 quiz
server.port=${PORT:8085}
logging.level.org.atmosphere=warn

vaadin.launch-browser=true
vaadin.devmode.devTools.enabled=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,de.witchcafe
vaadin.pushMode=disabled

# Lokal H2 in ./data; auf IONOS per Umgebungsvariablen auf MariaDB umstellen:
#   SPRING_DATASOURCE_URL=jdbc:mariadb://127.0.0.1:3306/billing
#   SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:h2:file:./data/witch-billing
spring.datasource.username=sa
spring.datasource.password=

# Vorerst wie in den anderen Apps; vor dem Produktivbetrieb auf Flyway umstellen
spring.jpa.hibernate.ddl-auto=update

# --- witch-billing ---
# Startguthaben fuer jeden neuen Benutzer (wird als eigene Buchung WELCOME angelegt)
witch-billing.welcome-credits=100

# Verbrauch auch ohne Guthaben buchen: das Konto geht ins Minus, die Apps sperren nicht,
# sondern zeigen Werbung (witch-billing-vaadin). false = bei zu wenig Guthaben ablehnen (HTTP 402).
witch-billing.allow-debt=${BILLING_ALLOW_DEBT:true}

# API-Keys der Apps fuer /api/** als SHA-256-Hash (hex), siehe README.
# Leer = diese App kann nicht buchen.
witch-billing.app-keys.quiz=${BILLING_KEY_HASH_QUIZ:}
witch-billing.app-keys.games=${BILLING_KEY_HASH_GAMES:}
witch-billing.app-keys.garten=${BILLING_KEY_HASH_GARTEN:}

# Eigener Session-Cookie-Name: Cookies trennen nicht nach Port, auf einem Host (QA) wuerden
# sich die Apps sonst gegenseitig den JSESSIONID ueberschreiben und abmelden.
server.servlet.session.cookie.name=BILLINGSESSION
